name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            asset_name: Rayneforge-OpenDefender-linux
            archive_ext: tar.gz
          - os: windows-latest
            runtime: win-x64
            asset_name: Rayneforge-OpenDefender-windows
            archive_ext: zip

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/ObservabilityStack.slnx

    - name: Build solution
      run: dotnet build src/ObservabilityStack.slnx -c Release --no-restore

    - name: Run tests (Disabled)
      run: echo "Skipping tests in CI environment"

    - name: Publish Service
      run: |
        dotnet publish src/Service/Service.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/${{ matrix.runtime }}

    # Create Zip for Windows
    - name: Pack Windows
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path publish/${{ matrix.runtime }}/* -DestinationPath ${{ matrix.asset_name }}.zip

    # Create Tarball for Linux
    - name: Pack Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czvf ${{ matrix.asset_name }}.tar.gz -C publish/${{ matrix.runtime }} .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          artifacts/Rayneforge-OpenDefender-linux/Rayneforge-OpenDefender-linux.tar.gz
          artifacts/Rayneforge-OpenDefender-windows/Rayneforge-OpenDefender-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/ObservabilityStack.slnx

    - name: Pack MCP Server
      run: dotnet pack src/Service/Service.csproj -c Release -o ./nupkg -p:Version=1.0.${{ github.run_number }}

    - name: Push to NuGet
      run: |
        dotnet nuget push ./nupkg/Rayneforge.OpenDefender.*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
