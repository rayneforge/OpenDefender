info:
  name: Resource Check
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/agents/core/resource-check"
  auth: inherit
  params:
    query:
      - name: publish
        value: "false"
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Check CPU, memory, disk, thermal, and GPU utilization against thresholds.
  Returns ResourceCheckResult: WithinBaseline, CpuPercent, MemPercent, DiskPercent, ThermalAlert, Flags, Level, Detail.
  Set publish=true to also dispatch the result to the task channel.
