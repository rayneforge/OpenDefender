info:
  name: Retention Audit
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/agents/ledger/retention-audit"
  auth: inherit
  params:
    query:
      - name: publish
        value: "false"
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Verify log retention meets policy targets per stream.
  Returns RetentionAuditResult: AllStreamsCompliant, NonCompliantStreams, HighNoiseSources, Level, Detail.
  Set publish=true to also dispatch the result to the task channel.
