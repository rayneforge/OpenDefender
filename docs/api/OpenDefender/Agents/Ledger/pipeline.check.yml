info:
  name: Pipeline Check
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/agents/ledger/pipeline-check"
  auth: inherit
  params:
    query:
      - name: publish
        value: "false"
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Check journal health, log source presence, and pipeline integrity.
  Returns PipelineCheckResult: PipelineHealthy, MissingSourceCount, BacklogDetected, Flags, Level, Detail.
  Set publish=true to also dispatch the result to the task channel.
