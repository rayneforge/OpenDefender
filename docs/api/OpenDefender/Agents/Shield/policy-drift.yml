info:
  name: Policy Drift
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/agents/shield/policy-drift"
  auth: inherit
  params:
    query:
      - name: publish
        value: "false"
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Detect drift in security policies against baseline.
  Returns PolicyDriftResult: DriftDetected, DriftFindings, Level, Detail.
  Set publish=true to also dispatch the result to the task channel.
