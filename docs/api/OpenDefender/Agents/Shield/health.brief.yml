info:
  name: Health Brief
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/agents/shield/health-brief"
  auth: inherit
  params:
    query:
      - name: publish
        value: "false"
        enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Compile the Shield weekly health brief.
  Returns HealthBriefResult: TopRisks, Changes, OpenItems, Level, Detail.
  Set publish=true to also dispatch the result to the task channel.
